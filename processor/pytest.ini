[pytest]
testpaths = tests
pythonpath = . contracts
# The default run excludes the heavy suite so `pytest` stays a one-second
# command that anyone can run on every commit. The heavy tests load real
# weights and are run deliberately:  pytest tests/heavy -m heavy
addopts = -m "not heavy"
markers =
    heavy: needs a downloaded model or a GPU; skipped when unavailable
