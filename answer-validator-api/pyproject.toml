[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-processor-api"
version = "0.1.0"
description = "LEDGER Task 2 — converts raw financial PDFs into the structured document contract"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-multipart>=0.0.12",
    "pypdfium2>=4.30",
    "ledger-doc-contract",
]

[project.optional-dependencies]
# The deep-learning backend. Kept optional so the contract package, the API,
# and the whole test suite install and run without it.
docling = ["docling>=2.0"]
dev = ["pytest>=8.3", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["app*"]
